<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypercycle</title>
<!-- Departure Mono is the ecosystem typeface. Hyperkit's tokens.css also carries
     an @import for it, but a <link> loads in parallel instead of blocking on CSS
     parse, and matches how HyperField pulls it in. Offline, the stack falls back
     through JetBrains Mono to the system monospace. -->
<link rel="preconnect" href="https://db.onlinewebfonts.com">
<link rel="stylesheet" href="https://db.onlinewebfonts.com/c/4571adf8e6d8270ea61a4f43a3ef31d2?family=Departure+Mono">
<style>
{{CSS}}
</style>
</head>
<body>
<div class="hc-app" id="hc-app" data-view="route">

  <!-- ============================================================
       ROUTE — the screen the app opens on
       ============================================================ -->
  <section class="hc-route" id="hc-route">
    <span class="hc-route-mark" id="hc-route-mark"></span>
    <h1 class="hc-route-greeting" id="hc-route-greeting">What are we converting?</h1>
    <div class="hc-modes" id="hc-modes"></div>
    <span class="hc-route-caps" id="hc-caps" data-tooltip="Engine availability"></span>
  </section>

  <!-- ============================================================
       WORK — the whole surface is the drop target
       ============================================================ -->
  <section class="hc-work" id="hc-work">

    <header class="hc-topbar">
      <button class="action-button hc-btn-sm" id="hc-back" aria-label="Back to conversion types">
        &larr; BACK
      </button>
      <span class="hc-work-mode" id="hc-work-mode"></span>
      <span class="hc-topbar-spacer"></span>
      <button class="action-button hc-btn-sm" id="hc-drawer-toggle"
              aria-expanded="false" aria-controls="hc-drawer">
        QUEUE <span class="status-chip status-chip-outlined-muted" id="hc-queue-count">0</span>
      </button>
    </header>

    <!-- Full-bleed drop surface -->
    <div class="hc-drop" id="hc-dropzone" tabindex="0" role="button"
         aria-label="Drop files here or click to browse">
      <span class="hc-drop-mark" id="hc-drop-mark"></span>
      <span class="hc-drop-label">DROP FILES HERE</span>
      <span class="hc-drop-sub">or click to browse</span>
      <span class="hc-drop-formats" id="hc-accepted"></span>
    </div>

    <!-- Queue drawer — composes .side-drawer geometry, driven non-modally
         so files can still be dropped while it is open. -->
    <aside class="side-drawer hc-drawer" id="hc-drawer" aria-label="Conversion queue">
      <div class="hc-drawer-head">
        <span class="hc-drawer-title">QUEUE</span>
        <span class="hc-bar-summary" id="hc-summary"></span>
        <button class="action-button hc-btn-sm" id="hc-drawer-close" aria-label="Close queue">
          &rarr;
        </button>
      </div>

      <div class="hc-groups" id="hc-groups"></div>
      <p class="hc-empty" id="hc-empty">Nothing queued.</p>

      <div class="hc-drawer-foot">
        <div class="hc-dest">
          <span class="hc-key">into</span>
          <span class="hc-dest-path" id="hc-outdir">No destination chosen</span>
        </div>
        <div class="hc-drawer-actions">
          <button class="action-button hc-btn-sm" id="hc-pick-outdir">CHANGE</button>
          <button class="action-button hc-btn-sm" id="hc-clear" disabled>CLEAR DONE</button>
          <button class="action-button action-button-primary hc-btn-sm" id="hc-start" disabled>
            CONVERT
          </button>
        </div>
      </div>
    </aside>

  </section>

  <div class="hc-toast-host" id="hc-toast-host" aria-live="polite"></div>
</div>

{{JS_BLOCKS}}
</body>
</html>
